name: conduit-aut

services:
  db:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: ${CONDUIT_DB_PASSWORD:?set CONDUIT_DB_PASSWORD in .env}
      POSTGRES_DB: conduit
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  api:
    image: conduit-aut/api:30b68e1
    build:
      context: https://github.com/gothinkster/node-express-realworld-example-app.git#30b68e1e881462b2f4164ea09ab4c4f5699c7b0b
      dockerfile_inline: |
        FROM node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
        RUN apt-get update && apt-get install -y --no-install-recommends openssl && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        ENV NX_DAEMON=false NX_NO_CLOUD=true
        COPY . .
        RUN npm ci && npx prisma generate && npx nx build api --configuration=production
        CMD ["sh", "-c", "npx prisma migrate deploy && node dist/api/main.js"]
    environment:
      DATABASE_URL: postgresql://conduit:${CONDUIT_DB_PASSWORD}@db:5432/conduit
      JWT_SECRET: ${CONDUIT_JWT_SECRET:?set CONDUIT_JWT_SECRET in .env}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/tags').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 384m

  web:
    image: conduit-aut/web:dd99ed2
    build:
      context: https://github.com/gothinkster/angular-realworld-example-app.git#dd99ed2cf39c805d719f943c5d7061a5683d98a8
      dockerfile_inline: |
        FROM node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da AS build
        COPY --from=oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d /usr/local/bin/bun /usr/local/bin/bun
        WORKDIR /app
        COPY . .
        RUN sed -i 's#https://api.realworld.show/api#/api#' src/app/core/interceptors/api.interceptor.ts && ! grep -rq 'api.realworld.show' src
        RUN bun install --frozen-lockfile --ignore-scripts && bun run build
        FROM nginx:1.31.8-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
        COPY --from=build /app/dist/angular-conduit/browser /usr/share/nginx/html
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${CONDUIT_PORT:?set CONDUIT_PORT in .env}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 64m
