name: Stability

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env && cat .env >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run aut:up
      - run: node scripts/aut-wait.mjs "$BASE_URL" 180
      - run: npm run test:stability
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stability-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - if: always()
        run: npm run aut:down
